<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Secret Vault</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 20px 16px 80px 16px;
  }
  .header-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(234, 179, 8, 0.3);
    border-radius: 24px;
    padding: 20px;
    text-align: center;
    backdrop-filter: blur(10px);
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(147, 51, 234, 0.15);
  }
  .title {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #facc15, #c084fc, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 13px; color: #cbd5e1; margin-top: 6px; }
  
  /* Sunflower & Lavender Garden */
  .garden {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    margin: 20px 0;
    font-size: 28px;
    filter: drop-shadow(0 2px 8px rgba(250, 204, 21, 0.4));
  }
  
  /* Dual Cats Play Area */
  .cats-container {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(192, 132, 252, 0.25);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    margin-bottom: 18px;
  }
  .cats-stage {
    display: flex;
    justify-content: space-around;
    font-size: 44px;
    margin: 12px 0;
  }
  .cat-bounce {
    animation: bounce 1.8s infinite ease-in-out;
    display: inline-block;
  }
  .cat-bounce-reverse {
    animation: bounce 1.8s infinite ease-in-out 0.9s;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px) rotate(4deg); }
  }

  /* Cute Panda Hug Button */
  .hug-btn {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    transition: transform 0.2s;
  }
  .hug-btn:active { transform: scale(0.95); }

  /* Countdown & Weather Cards */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .mini-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 14px;
    text-align: center;
  }
  .mini-card h4 { font-size: 13px; color: #facc15; margin-bottom: 4px; }
  .mini-card p { font-size: 18px; font-weight: 700; color: #f1f5f9; }

  /* Chai & Coffee */
  .cups {
    font-size: 26px;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="header-card">
    <div class="title">Bhanu & Gun Space 🌻💜</div>
    <div class="subtitle">Protected by My Notes Stealth Security</div>
  </div>

  <div class="garden">
    <span>🌻</span><span>💜</span><span>🌻</span><span>💜</span><span>🌻</span>
  </div>

  <div class="cats-container">
    <p style="font-size: 14px; color: #e2e8f0; font-weight: 600;">Playful Cats</p>
    <div class="cats-stage">
      <div class="cat-bounce" title="Gun">🐱</div>
      <div style="font-size: 24px; align-self: center;">☕ 🍵</div>
      <div class="cat-bounce-reverse" title="Bhanu">🐾</div>
    </div>
    <button class="hug-btn" onclick="sendHug()">Send Panda Hug 🐼💖</button>
    <div id="hugMessage" style="margin-top: 10px; font-size: 13px; color: #f472b6;"></div>
  </div>

  <div class="grid-2">
    <div class="mini-card">
      <h4>Countdown</h4>
      <p id="countdown">Loading...</p>
    </div>
    <div class="mini-card">
      <h4>Weather & Vibes</h4>
      <p>Sunny 27°C ☀️</p>
    </div>
  </div>

  <div class="mini-card" style="margin-top: 10px;">
    <h4>Playlist & Radio</h4>
    <p style="font-size: 14px; color: #c084fc; margin-top: 4px;">🎵 Favorite Lo-Fi & Melodies</p>
  </div>

  <script>
    function sendHug() {
      const msg = document.getElementById('hugMessage');
      msg.innerText = "🐼 Warm cuddles & hugs sent across distance! ✨";
      setTimeout(() => { msg.innerText = ""; }, 3500);
    }

    function updateCountdown() {
      const target = new Date();
      target.setDate(target.getDate() + 7);
      const now = new Date();
      const diff = target - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('countdown').innerText = days + "d " + hours + "h left";
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>
</body>
</html>
