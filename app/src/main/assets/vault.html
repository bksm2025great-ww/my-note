<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Secret Vault</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-dark: #0b0f19;
    --card-bg: rgba(255, 255, 255, 0.04);
    --border-color: rgba(255, 255, 255, 0.08);
    --pink-red: #f43f5e;
    --yellow-peach: #fbbf24;
    --bhanu-yellow: #fef08a;
    --gun-pink: #f472b6;
    --gun-lavender: #c084fc;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
 body { background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 75%); color: var(--text-main); min-height: 100vh; padding: 54px 16px 80px 16px; overflow-x: hidden; position: relative; }

  /* SVG Icons */
  .icon { width: 18px; height: 18px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Top Navigation Bar */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .title-wrap h2 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .title-wrap p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  
  /* Single 60% Transparent Lock Button */
  .btn-lock { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-main); padding: 8px 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* Dual Status (Weather & Distance) */
  .grid-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .status-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px; }
  .status-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--gun-lavender); font-weight: 600; margin-bottom: 8px; }
  .status-value { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .status-sub { font-size: 11px; color: var(--text-muted); }

  /* Calendar Section */
  .calendar-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 22px; padding: 18px; margin-bottom: 20px; }
  .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .calendar-nav h3 { font-size: 16px; font-weight: 600; }
  .nav-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .day-label { font-size: 11px; color: var(--text-muted); padding-bottom: 6px; font-weight: 600; }
  .date-cell { width: 36px; height: 36px; line-height: 34px; margin: 0 auto; border-radius: 50%; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; border: 1.5px solid transparent; }
  
  .circle-special { border-color: var(--pink-red); color: #fff; box-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }
  .circle-effort { border-color: var(--yellow-peach); color: #fff; box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
  .circle-special.active { background: linear-gradient(135deg, #f43f5e, #be123c); border-color: transparent; }
  .circle-effort.active { background: linear-gradient(135deg, #fbbf24, #d97706); border-color: transparent; color: #000; font-weight: 700; }

  /* Memory Card Under Calendar */
  .memory-card { margin-top: 14px; border-radius: 16px; padding: 14px; display: none; animation: fadeIn 0.3s ease; }
  .memory-card.special-card { background: rgba(244, 63, 94, 0.12); border: 1px solid var(--pink-red); }
  .memory-card.effort-card { background: rgba(251, 191, 36, 0.12); border: 1px solid var(--yellow-peach); }
  .memory-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .memory-desc { font-size: 12px; color: #e2e8f0; line-height: 1.4; margin-bottom: 10px; }
  .btn-mini-del { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fda4af; font-size: 11px; padding: 4px 10px; border-radius: 10px; cursor: pointer; }

  /* Section Containers */
  .section-wrap { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px; margin-bottom: 20px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .btn-small-add { background: rgba(192, 132, 252, 0.15); border: 1px solid var(--gun-lavender); color: var(--gun-lavender); font-size: 11px; padding: 5px 12px; border-radius: 12px; cursor: pointer; }

  /* Multiple Timers */
  .timer-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .timer-info { flex: 1; }
  .timer-title { font-size: 12px; color: var(--gun-lavender); margin-bottom: 4px; }
  .timer-digits { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
  .timer-digits span { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-right: 5px; }

  /* Spotify Tracks: Custom Yellow & Pink-Lavender Themes */
  .spotify-item-bhanu { background: linear-gradient(135deg, rgba(254, 240, 138, 0.08), rgba(202, 138, 4, 0.03)); border: 1px solid rgba(254, 240, 138, 0.25); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .spotify-item-gun { background: linear-gradient(135deg, rgba(244, 114, 182, 0.08), rgba(192, 132, 252, 0.05)); border: 1px solid rgba(244, 114, 182, 0.25); border-radius: 14px; padding: 14px; }
  .bhanu-tag { font-size: 11px; color: var(--bhanu-yellow); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
  .gun-tag { font-size: 11px; background: linear-gradient(90deg, var(--gun-pink), var(--gun-lavender)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
  .spotify-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-color); color: #fff; font-size: 13px; padding: 6px 0; outline: none; }
  .spotify-input::placeholder { color: var(--text-muted); }

/* Instagram Pop-in Neon Hearts (Wahin Par Pop & Glow) */
  .heart-particle { 
    position: fixed; 
    pointer-events: none; 
    z-index: 999; 
    transform: translate(-50%, -50%);
    animation: instaHeartPop 2.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
    filter: drop-shadow(0 0 15px #ff2a85) drop-shadow(0 0 30px rgba(255, 42, 133, 0.6));
  }
  .heart-particle svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 42, 133, 0.15);
    stroke: #ff2a85;
    stroke-width: 3.5;
  }
  @keyframes instaHeartPop {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.95; }
    75% { opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
  }

  /* Calendar Dots & Multi-Event Styles */
  .event-dots-container {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-top: 2px;
  }
  .event-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-unforgettable { background: #ff2a85; box-shadow: 0 0 6px #ff2a85; }
  .dot-celebration   { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
  .dot-sweet         { background: #facc15; box-shadow: 0 0 6px #facc15; }
  .dot-whispers      { background: #c084fc; box-shadow: 0 0 6px #c084fc; }
  .dot-smiles        { background: #2dd4bf; box-shadow: 0 0 6px #2dd4bf; }
  /* Modal Form (Add Date Memory & Add Countdown) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: #131927; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 20px; width: 100%; max-width: 320px; }
  .modal-box h4 { font-size: 16px; margin-bottom: 12px; }
  .modal-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; outline: none; }
  .modal-select { width: 100%; background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; padding: 10px; margin-bottom: 14px; font-size: 13px; outline: none; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-modal-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; }
  .btn-modal-save { background: linear-gradient(135deg, #8b5cf6, #ec4899); border: none; color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

   // --- Supabase Connection ---
const SUPABASE_URL = 'https://cwrjrpfvyqjujnxohhpg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cmpycGZ2eXFqdWpueG9oaHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzQzMjcsImV4cCI6MjEwNzA1MDMyN30.U25FoTSwY53kie1pQehE0WFf58Z8f-QpjMMoS-aHKN8 '; 
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const VAULT_KEY = 'bhanu_gun_secret';
    // --- Cloud Sync Helpers ---
    async function syncToCloud(category, data) {
      try {
        await db.from('vault_items').delete().eq('category', category).eq('secret_hash', VAULT_KEY);
        await db.from('vault_items').insert([{
          category: category,
          payload: typeof data === 'string' ? data : JSON.stringify(data),
          secret_hash: VAULT_KEY

 // --- Tracks Memory & State ---

    let tracksGun = JSON.parse(localStorage.getItem('vault_tracks_gun') || '[]');
    let removeModeBhanu = false;
    let removeModeGun = false;

    // --- Cloud Sync Helpers ---
    async function syncToCloud(category, data) {
      try {
        await db.from('vault_items').delete().eq('category', category).eq('secret_hash', VAULT_KEY);
        await db.from('vault_items').insert([{
          category: category,
          payload: typeof data === 'string' ? data : JSON.stringify(data),
          secret_hash: VAULT_KEY
        }]);
      } catch (e) {
        console.error('Cloud sync error:', e);
      }
    }

    async function loadFromCloud() {
      try {
        const { data } = await db.from('vault_items').select('*').eq('secret_hash', VAULT_KEY);
        if (!data || data.length === 0) {
          renderAllTracks();
          return;
        }
        data.forEach(item => {
          if (item.category === 'memories') {
            memories = JSON.parse(item.payload);
            localStorage.setItem('vault_memories_v2', item.payload);
            renderCalendar();
          } else if (item.category === 'countdowns') {
            countdowns = JSON.parse(item.payload);
            localStorage.setItem('vault_countdowns_v2', item.payload);
            renderCountdowns();
          } else if (item.category === 'tracks_bhanu_v3') {
            tracksBhanu = JSON.parse(item.payload);
            localStorage.setItem('vault_tracks_bhanu', item.payload);
            renderTracks('bhanu');
          } else if (item.category === 'tracks_gun_v3') {
            tracksGun = JSON.parse(item.payload);
            localStorage.setItem('vault_tracks_gun', item.payload);
            renderTracks('gun');
          } else if (item.category === 'loc_bhanu') {
            const el = document.getElementById('locBhanu');
            if (el) el.innerText = item.payload;
            localStorage.setItem('loc_bhanu', item.payload);
          } else if (item.category === 'loc_gun') {
            const el = document.getElementById('locGun');
            if (el) el.innerText = item.payload;
            localStorage.setItem('loc_gun', item.payload);
          }
        });
        renderAllTracks();
      } catch (e) {
        console.error('Cloud load error:', e);
      }
    }

    // --- Spotify Compact Player Engine ---
    function renderAllTracks() {
      renderTracks('bhanu');
      renderTracks('gun');
    }

    function renderTracks(user) {
      const container = document.getElementById(user === 'bhanu' ? 'tracksBhanu' : 'tracksGun');
      if (!container) return;
      const list = user === 'bhanu' ? tracksBhanu : tracksGun;

      if (!list || list.length === 0) {
        container.innerHTML = '<div class="no-tracks-txt">No tracks suggested yet. Tap + Add to share music.</div>';
        return;
      }

      container.innerHTML = list.map((track, idx) => `
        <div class="spotify-player-card">
          <div class="player-left" onclick="openSpotifyApp('${track.url}')">
            <img class="album-cover" src="${track.cover || 'https://open.spotifycdn.com/cdn/images/favicon32.8e66b099.png'}" alt="Art">
            <div class="track-details">
              <span class="track-title">${track.title || 'Spotify Track'}</span>
              <span class="track-artist">${track.artist || 'Tap to play on Spotify'}</span>
            </div>
          </div>
          <div class="player-right">
            <button type="button" class="spotify-play-btn" onclick="openSpotifyApp('${track.url}')" title="Play">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
            <button type="button" class="track-del-btn" onclick="deleteTrack('${user}', ${idx})" title="Remove">✕</button>
          </div>
        </div>
      `).join('');
    }

    function openSpotifyApp(url) {
      if (!url) return;
      // Direct intent / Spotify link trigger
      window.location.href = url;
    }

    async function promptAddTrack(user) {
      const list = user === 'bhanu' ? tracksBhanu : tracksGun;
      if (list.length >= 3) {
        alert('Maximum 3 tracks allowed per person. Please remove an existing song first!');
        return;
      }

      const inputUrl = prompt('Paste Spotify Track Link (open.spotify.com/track/...):');
      if (!inputUrl || !inputUrl.trim()) return;

      const cleanUrl = inputUrl.trim();
      const newTrack = {
        url: cleanUrl,
        title: 'Spotify Track',
        artist: 'Playing on Spotify',
        cover: 'https://open.spotifycdn.com/cdn/images/favicon32.8e66b099.png'
      };

      // Auto-fetch song title & album art from Spotify
      try {
        const res = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(cleanUrl));
        if (res.ok) {
          const meta = await res.json();
          if (meta.title) newTrack.title = meta.title;
          if (meta.thumbnail_url) newTrack.cover = meta.thumbnail_url;
        }
      } catch (err) {
        console.log('Using default cover art fallback');
      }

      list.push(newTrack);
      saveTracks(user);
    }

    function toggleRemoveMode(user) {
      const container = document.getElementById(user === 'bhanu' ? 'tracksBhanu' : 'tracksGun');
      const btn = document.getElementById(user === 'bhanu' ? 'removeBtnBhanu' : 'removeBtnGun');
      if (!container || !btn) return;

      const isRemoving = container.classList.toggle('is-removing');
      btn.classList.toggle('active-remove', isRemoving);
    }

    function deleteTrack(user, index) {
      const list = user === 'bhanu' ? tracksBhanu : tracksGun;
      list.splice(index, 1);
      saveTracks(user);
    }

    function saveTracks(user) {
      const list = user === 'bhanu' ? tracksBhanu : tracksGun;
      const category = user === 'bhanu' ? 'tracks_bhanu_v3' : 'tracks_gun_v3';
      const storageKey = user === 'bhanu' ? 'vault_tracks_bhanu' : 'vault_tracks_gun';

      localStorage.setItem(storageKey, JSON.stringify(list));
      syncToCloud(category, list);
      renderTracks(user);
    }
   // --- 1. Instagram Neon Glowing Pop Hearts ---
    function burstHearts() {
      const heartCount = 7;
      for (let i = 0; i < heartCount; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'heart-particle';
          const size = Math.floor(Math.random() * 55 + 75); // 75px se 130px bade glowing hearts
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.left = (Math.random() * 70 + 15) + 'vw';
          el.style.top = (Math.random() * 65 + 15) + 'vh';
          const rot = Math.floor(Math.random() * 30 - 15);
          el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
          el.innerHTML = `
            <svg viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          `;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2500);
        }, i * 200);
      }
    }
    burstHearts();

    // --- 2. Dynamic Calendar System ---
   const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
    let selectedDateKey = null;

    let memories = JSON.parse(localStorage.getItem('vault_memories_v2') || JSON.stringify({
      "2026-11-03": { type: 'special', heading: 'Special Day', subtitle: 'A very special moment to remember and celebrate together.' },
      "2026-11-14": { type: 'effort', heading: 'Thoughtful Evening', subtitle: 'A cozy coffee conversation filled with sweet efforts.' }
    }));

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function changeMonth(delta) {
      viewMonth += delta;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
      document.getElementById('memoryCard').style.display = 'none';
    }

    const eventPriority = ['unforgettable', 'celebration', 'sweet', 'whispers', 'smiles', 'special', 'effort'];

    function renderCalendar() {
      document.getElementById('calendarMonthTitle').innerText = `${monthNames[viewMonth]} ${viewYear}`;
      const grid = document.getElementById('calendarDaysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const offset = (firstDay === 0 ? 7 : firstDay) - 1; // Mon = 0
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        grid.appendChild(empty);
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        
        const dateKey = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayEvents = memories[dateKey] ? (Array.isArray(memories[dateKey]) ? memories[dateKey] : [memories[dateKey]]) : [];

        // Date Number
        const numSpan = document.createElement('span');
        numSpan.innerText = d;
        cell.appendChild(numSpan);

        if (dayEvents.length > 0) {
          // 1. Superior Glow Decision
          let superior = dayEvents[0];
          for (const p of eventPriority) {
            const found = dayEvents.find(e => (e.type || '') === p);
            if (found) { superior = found; break; }
          }

          if (superior.type === 'unforgettable' || superior.type === 'special') {
            cell.style.background = 'radial-gradient(circle, rgba(255,42,133,0.38) 0%, rgba(255,42,133,0.08) 75%)';
            cell.style.border = '1px solid #ff2a85';
            cell.style.boxShadow = '0 0 10px rgba(255,42,133,0.45)';
          } else if (superior.type === 'celebration') {
            cell.style.background = 'radial-gradient(circle, rgba(245,158,11,0.38) 0%, rgba(245,158,11,0.08) 75%)';
            cell.style.border = '1px solid #f59e0b';
            cell.style.boxShadow = '0 0 10px rgba(245,158,11,0.45)';
          } else if (superior.type === 'sweet' || superior.type === 'effort') {
            cell.style.background = 'radial-gradient(circle, rgba(250,204,21,0.3) 0%, rgba(250,204,21,0.06) 75%)';
            cell.style.border = '1px solid #facc15';
          } else if (superior.type === 'whispers') {
            cell.style.background = 'radial-gradient(circle, rgba(192,132,252,0.3) 0%, rgba(192,132,252,0.06) 75%)';
            cell.style.border = '1px solid #c084fc';
          } else if (superior.type === 'smiles') {
            cell.style.background = 'radial-gradient(circle, rgba(45,212,191,0.3) 0%, rgba(45,212,191,0.06) 75%)';
            cell.style.border = '1px solid #2dd4bf';
          }

          // 2. Dots for Multiple Events
          if (dayEvents.length > 1) {
            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'event-dots-container';
            dayEvents.slice(1).forEach(ev => {
              const dot = document.createElement('span');
              let dotClass = 'dot-sweet';
              if (ev.type === 'unforgettable' || ev.type === 'special') dotClass = 'dot-unforgettable';
              else if (ev.type === 'celebration') dotClass = 'dot-celebration';
              else if (ev.type === 'whispers') dotClass = 'dot-whispers';
              else if (ev.type === 'smiles') dotClass = 'dot-smiles';
              dot.className = `event-dot ${dotClass}`;
              dotsWrap.appendChild(dot);
            });
            cell.appendChild(dotsWrap);
          }
        }

        cell.onclick = () => onDateClicked(dateKey, d, cell);
        grid.appendChild(cell);
      }
    }

  function onDateClicked(dateKey, day, cell) {
      document.querySelectorAll('.date-cell').forEach(c => c.classList.remove('active'));
      selectedDateKey = dateKey;

      const dayEvents = memories[dateKey] ? (Array.isArray(memories[dateKey]) ? memories[dateKey] : [memories[dateKey]]) : [];

      if (dayEvents.length > 0) {
        if (cell) cell.classList.add('active');
        const card = document.getElementById('memoryCard');
        card.style.display = 'block';

        // 1. Header with Clean "+ Add More" Button
        let html = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
            <span style="font-weight: 600; font-size: 15px; color: #fff;">${day} ${monthNames[viewMonth]}</span>
            <button onclick="openDateModal('${dateKey}', ${day})" style="background: rgba(255,42,133,0.15); border: 1px solid rgba(255,42,133,0.4); color: #ff2a85; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">
              + Add More
            </button>
          </div>
        `;

        // 2. Minimalist Memory List
        const typeColors = {
          unforgettable: '#ff2a85',
          celebration: '#f59e0b',
          sweet: '#facc15',
          whispers: '#c084fc',
          smiles: '#2dd4bf',
          special: '#ff2a85',
          effort: '#facc15'
        };

        dayEvents.forEach((ev, idx) => {
          const color = typeColors[ev.type] || '#ff2a85';
          html += `
            <div style="position: relative; padding: 8px 10px; margin-bottom: 8px; background: rgba(255,255,255,0.04); border-left: 3px solid ${color}; border-radius: 4px;">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <div style="font-weight: 600; font-size: 13px; color: #fff;">${ev.heading || 'Memory'}</div>
                <button onclick="deleteSingleMemory('${dateKey}', ${idx})" style="background: transparent; border: none; color: rgba(255,255,255,0.4); font-size: 13px; cursor: pointer; padding: 0 4px;" title="Delete">✕</button>
              </div>
              ${ev.subtitle ? `<div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px;">${ev.subtitle}</div>` : ''}
            </div>
          `;
        });

        card.innerHTML = html;
      } else {
        openDateModal(dateKey, day);
      }
    }

    // Ek single memory ko delete karne ka function
    function deleteSingleMemory(dateKey, index) {
      if (!memories[dateKey]) return;
      if (!Array.isArray(memories[dateKey])) memories[dateKey] = [memories[dateKey]];

      memories[dateKey].splice(index, 1);

      if (memories[dateKey].length === 0) {
        delete memories[dateKey];
        const card = document.getElementById('memoryCard');
        if (card) card.style.display = 'none';
      }

      localStorage.setItem('vault_memories_v2', JSON.stringify(memories));
      syncToCloud('memories', memories);
      renderCalendar();

      if (memories[dateKey]) {
        const day = parseInt(dateKey.split('-')[2]);
        onDateClicked(dateKey, day, document.querySelector('.date-cell.active'));
      }
    }

    // --- Save Date Memory (Multi-event append structure) ---
    function saveDateMemory() {
      const heading = document.getElementById('inputHeading').value.trim();
      const subtitle = document.getElementById('inputSubtitle').value.trim();
      const type = document.getElementById('selectType').value;

      if (!heading) {
        alert('Please enter a heading');
        return;
      }

      if (!memories[selectedDateKey]) {
        memories[selectedDateKey] = [];
      } else if (!Array.isArray(memories[selectedDateKey])) {
        memories[selectedDateKey] = [memories[selectedDateKey]];
      }

      // Purani memory delete nahi hogi, nayi list me jud jayegi
      memories[selectedDateKey].push({
        type: type,
        heading: heading,
        subtitle: subtitle,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem('vault_memories_v2', JSON.stringify(memories));
      syncToCloud('memories', memories);

      closeDateModal();
      document.getElementById('inputHeading').value = '';
      document.getElementById('inputSubtitle').value = '';

      renderCalendar();
      const day = parseInt(selectedDateKey.split('-')[2]);
      onDateClicked(selectedDateKey, day, document.querySelector('.date-cell.active'));
    }

    // --- 1-Year Anniversary Checker & Subtle Haptic Buzz ---
    function checkOneYearCelebration() {
      const t = new Date();
      const todayMonthDay = `-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
      
      Object.keys(memories).forEach(dateStr => {
        const [evYear] = dateStr.split('-');
        const yearDiff = t.getFullYear() - parseInt(evYear);

        if (dateStr.endsWith(todayMonthDay) && yearDiff >= 1) {
          // 1. Ek baar halka sa subtle haptic vibration
          if (navigator.vibrate) {
            navigator.vibrate(40);
          }
          // 2. Neon hearts celebration popup
          burstHearts();
        }
      });
    }
    function openDateModal(dateKey, day) {
      selectedDateKey = dateKey;
      document.getElementById('modalDateLabel').innerText = `Add Note • ${day} ${monthNames[viewMonth]} ${viewYear}`;
      document.getElementById('inputHeading').value = '';
      document.getElementById('inputSubtitle').value = '';
      document.getElementById('dateModal').style.display = 'flex';
    }

    function closeDateModal() {
      document.getElementById('dateModal').style.display = 'none';
    }

    function saveDateMemory() {
      const heading = document.getElementById('inputHeading').value.trim();
      const subtitle = document.getElementById('inputSubtitle').value.trim();
      const type = document.getElementById('selectType').value;

      if (!heading) return;

      memories[selectedDateKey] = { type, heading, subtitle };
      localStorage.setItem('vault_memories_v2', JSON.stringify(memories));
      syncToCloud('memories', memories);
      closeDateModal();
      renderCalendar();
    }

    // --- 3. Multiple Real Countdowns ---
    let countdowns = JSON.parse(localStorage.getItem('vault_countdowns_v2') || JSON.stringify([
      { id: 1, title: 'Special Meeting', target: '2026-11-03T08:00:00' }
    ]));

    function renderCountdowns() {
      const container = document.getElementById('countdownsContainer');
      container.innerHTML = '';

      countdowns.forEach(item => {
        const box = document.createElement('div');
        box.className = 'timer-box';
        box.innerHTML = `
          <div class="timer-info">
            <div class="timer-title">${item.title} • ${new Date(item.target).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}, 8:00 AM</div>
            <div class="timer-digits" id="timer-${item.id}">Calculating...</div>
          </div>
          <button class="btn-mini-del" onclick="deleteCountdown(${item.id})">✕</button>
        `;
        container.appendChild(box);
      });
    }

    function updateTimers() {
      const now = new Date().getTime();
      countdowns.forEach(item => {
        const diff = new Date(item.target).getTime() - now;
        const el = document.getElementById(`timer-${item.id}`);
        if (!el) return;

        if (diff <= 0) {
          el.innerHTML = "Moments Arrived!";
        } else {
          const d = Math.floor(diff / (1000 * 60 * 60 * 24));
          const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const m = Math.floor((diff / (1000 * 60)) % 60);
          const s = Math.floor((diff / 1000) % 60);
          el.innerHTML = `${d}<span>d</span> ${String(h).padStart(2,'0')}<span>h</span> ${String(m).padStart(2,'0')}<span>m</span> ${String(s).padStart(2,'0')}<span>s</span>`;
        }
      });
    }
    setInterval(updateTimers, 1000);

    function openCountdownModal() { document.getElementById('countdownModal').style.display = 'flex'; }
    function closeCountdownModal() { document.getElementById('countdownModal').style.display = 'none'; }
    function saveNewCountdown() {
      const title = document.getElementById('inputCdTitle').value.trim();
      const target = document.getElementById('inputCdTarget').value;
      if (!title || !target) return;

      countdowns.push({ id: Date.now(), title, target });
      localStorage.setItem('vault_countdowns_v2', JSON.stringify(countdowns));
      syncToCloud('countdowns', countdowns);
      closeCountdownModal();
      renderCountdowns();
      updateTimers();
    }
    function deleteCountdown(id) {
      countdowns = countdowns.filter(c => c.id !== id);
      localStorage.setItem('vault_countdowns_v2', JSON.stringify(countdowns));
     syncToCloud('countdowns', countdowns); 
      renderCountdowns();
    }

    // --- 4. Spotify Tracks ---
    function saveTrack(who, val) { 
      localStorage.setItem('track_' + who, val); 
      syncToCloud('track_' + who, val);
    }
    document.getElementById('songBhanu').value = localStorage.getItem('track_bhanu') || '';
    document.getElementById('songGun').value = localStorage.getItem('track_gun') || '';

    // Init
    renderCalendar();
    checkOneYearCelebration();
    renderCountdowns();
    updateTimers();
    loadFromCloud();
    // --- Auto-Lock on App Switch / Screen Off ---
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (window.parent && window.parent.lockVaultToNotes) {
          window.parent.lockVaultToNotes();
        } else {
          location.reload();
        }
      }
    });
  </script>
</body>
</html>
